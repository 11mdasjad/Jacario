services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jacario-web:latest
    container_name: jacario_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "JACARIO"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "jacario"
      DB_USERNAME: "jacario_user"
      DB_PASSWORD: "jacario_secure_password"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - jacario-network

  db:
    image: mysql:8.0
    container_name: jacario_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "jacario"
      MYSQL_USER: "jacario_user"
      MYSQL_PASSWORD: "jacario_secure_password"
      MYSQL_ROOT_PASSWORD: "jacario_root_secure_password"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jacario-network

  redis:
    image: redis:alpine
    container_name: jacario_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - jacario-network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  jacario-network:
    driver: bridge
