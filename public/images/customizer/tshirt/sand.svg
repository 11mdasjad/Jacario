<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" class="w-full h-full object-contain">
  <defs>
    <linearGradient id="tshirt_cust_sand_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE2D5" />
      <stop offset="50%" stop-color="#D6C7B2" />
      <stop offset="100%" stop-color="#B8A58B" />
    </linearGradient>
    <linearGradient id="tshirt_cust_sand_crew" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EAE2D5" />
      <stop offset="100%" stop-color="#A89478" />
    </linearGradient>
    <filter id="tshirt_cust_sand_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <pattern id="tshirt_cust_sand_jersey" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#ffffff" fill-opacity="0.03" />
      <circle cx="3" cy="3" r="0.6" fill="#000000" fill-opacity="0.04" />
    </pattern>
  </defs>

  <g filter="url(#tshirt_cust_sand_shadow)">
    <!-- Main Body Contour -->
    <path d="M 215,120 L 130,185 L 80,268 L 140,298 L 175,248 L 180,600 C 180,615 420,615 420,600 L 425,248 L 460,298 L 520,268 L 470,185 L 385,120 C 335,138 265,138 215,120 Z" 
          fill="url(#tshirt_cust_sand_body)" stroke="#B8A58B" stroke-width="2" stroke-linejoin="round" />

    <!-- Fine Jersey Cotton Texture -->
    <path d="M 215,120 L 130,185 L 80,268 L 140,298 L 175,248 L 180,600 C 180,615 420,615 420,600 L 425,248 L 460,298 L 520,268 L 470,185 L 385,120 C 335,138 265,138 215,120 Z" 
          fill="url(#tshirt_cust_sand_jersey)" />

    <!-- Left Sleeve Cuff -->
    <path d="M 80,268 L 140,298 L 135,310 L 73,278 Z" fill="#A89478" stroke="#B8A58B" stroke-width="1.5"/>
    <line x1="82" y1="272" x2="137" y2="300" stroke="#EAE2D5" stroke-width="1" opacity="0.5"/>

    <!-- Right Sleeve Cuff -->
    <path d="M 520,268 L 460,298 L 465,310 L 527,278 Z" fill="#A89478" stroke="#B8A58B" stroke-width="1.5"/>
    <line x1="518" y1="272" x2="463" y2="300" stroke="#EAE2D5" stroke-width="1" opacity="0.5"/>

    <!-- Bottom Hem Details -->
    <path d="M 180,590 C 240,598 360,598 420,590" stroke="#B8A58B" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 180,594 C 240,602 360,602 420,594" stroke="#EAE2D5" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.7"/>

    <!-- Inner Neck Label Patch -->
    <path d="M 245,125 C 275,140 325,140 355,125 L 350,175 C 320,182 280,182 250,175 Z" fill="#0B0D10" />
    <text x="300" y="152" fill="#C5A880" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">JACARIO</text>
    <text x="300" y="166" fill="#A1A1AA" font-family="sans-serif" font-size="6" letter-spacing="1" text-anchor="middle">100% SUPIMA® CREW</text>

    <!-- Ribbed Crewneck Collar -->
    <path d="M 230,120 C 260,158 340,158 370,120 C 350,135 250,135 230,120 Z" 
          fill="url(#tshirt_cust_sand_crew)" stroke="#B8A58B" stroke-width="2.5" />
    <path d="M 235,122 C 265,152 335,152 365,122" fill="none" stroke="#EAE2D5" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  </g>
</svg>