<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" class="w-full h-full object-contain">
  <defs>
    <linearGradient id="polo_burgundy_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A2832" />
      <stop offset="50%" stop-color="#5C1D24" />
      <stop offset="100%" stop-color="#3B1015" />
    </linearGradient>
    <linearGradient id="polo_burgundy_collar" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7A2832" />
      <stop offset="100%" stop-color="#320B0F" />
    </linearGradient>
    <linearGradient id="polo_burgundy_sleeve_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A2832" />
      <stop offset="100%" stop-color="#3B1015" />
    </linearGradient>
    <linearGradient id="polo_burgundy_sleeve_right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A2832" />
      <stop offset="100%" stop-color="#3B1015" />
    </linearGradient>
    <filter id="polo_burgundy_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <pattern id="polo_burgundy_pique" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" fill-opacity="0.04" />
      <circle cx="5" cy="5" r="0.8" fill="#000000" fill-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Background Soft Radial -->
  <rect width="600" height="700" fill="#f8f9fa" opacity="0.4" rx="20"/>

  <g filter="url(#polo_burgundy_shadow)">
    <!-- Main Body Contour -->
    <path d="M 210,130 L 130,195 L 85,280 L 140,310 L 175,255 L 180,600 C 180,615 420,615 420,600 L 425,255 L 460,310 L 515,280 L 470,195 L 390,130 C 340,145 260,145 210,130 Z" 
          fill="url(#polo_burgundy_body)" stroke="#3B1015" stroke-width="2" stroke-linejoin="round" />

    <!-- Pique Texture Overlay -->
    <path d="M 210,130 L 130,195 L 85,280 L 140,310 L 175,255 L 180,600 C 180,615 420,615 420,600 L 425,255 L 460,310 L 515,280 L 470,195 L 390,130 C 340,145 260,145 210,130 Z" 
          fill="url(#polo_burgundy_pique)" />

    <!-- Left Sleeve Cuff -->
    <path d="M 85,280 L 140,310 L 135,322 L 78,290 Z" fill="#320B0F" stroke="#3B1015" stroke-width="1.5"/>
    <line x1="86" y1="284" x2="137" y2="312" stroke="#E5B887" stroke-width="1.5" opacity="0.6"/>

    <!-- Right Sleeve Cuff -->
    <path d="M 515,280 L 460,310 L 465,322 L 522,290 Z" fill="#320B0F" stroke="#3B1015" stroke-width="1.5"/>
    <line x1="514" y1="284" x2="463" y2="312" stroke="#E5B887" stroke-width="1.5" opacity="0.6"/>

    <!-- Bottom Hem Details -->
    <path d="M 180,590 C 240,598 360,598 420,590" stroke="#3B1015" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 180,594 C 240,602 360,602 420,594" stroke="#7A2832" stroke-width="1" stroke-dasharray="4,4" fill="none" opacity="0.7"/>

    <!-- Side Slits -->
    <line x1="180" y1="575" x2="180" y2="600" stroke="#3B1015" stroke-width="3"/>
    <line x1="420" y1="575" x2="420" y2="600" stroke="#3B1015" stroke-width="3"/>

    <!-- Inner Neck Label Patch -->
    <path d="M 260,138 C 280,148 320,148 340,138 L 335,185 C 315,190 285,190 265,185 Z" fill="#0B0D10" />
    <text x="300" y="165" fill="#C5A880" font-family="'Cinzel', 'Playfair Display', serif" font-size="10" font-weight="bold" letter-spacing="2" text-anchor="middle">JACARIO</text>
    <text x="300" y="177" fill="#A1A1AA" font-family="sans-serif" font-size="6" letter-spacing="1" text-anchor="middle">100% SUPIMA</text>

    <!-- Placket Center Box -->
    <path d="M 276,140 L 324,140 L 324,285 L 300,305 L 276,285 Z" fill="#5C1D24" stroke="#3B1015" stroke-width="1.5"/>
    <path d="M 276,140 L 324,140 L 324,285 L 300,305 L 276,285 Z" fill="url(#polo_burgundy_pique)"/>

    <!-- Placket Stitching Lines -->
    <line x1="280" y1="145" x2="280" y2="280" stroke="#3B1015" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="320" y1="145" x2="320" y2="280" stroke="#3B1015" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

    <!-- Mother of Pearl Buttons -->
    <g transform="translate(300, 180)">
      <circle cx="0" cy="0" r="6" fill="#FDE047" stroke="#64748B" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#475569" stroke-width="0.5"/>
      <circle cx="-1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="-1.5" cy="1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#1E293B"/>
    </g>

    <g transform="translate(300, 220)">
      <circle cx="0" cy="0" r="6" fill="#FDE047" stroke="#64748B" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#475569" stroke-width="0.5"/>
      <circle cx="-1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="-1.5" cy="1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#1E293B"/>
    </g>

    <g transform="translate(300, 260)">
      <circle cx="0" cy="0" r="6" fill="#FDE047" stroke="#64748B" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="4" fill="none" stroke="#475569" stroke-width="0.5"/>
      <circle cx="-1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="-1.5" r="0.6" fill="#1E293B"/>
      <circle cx="-1.5" cy="1.5" r="0.6" fill="#1E293B"/>
      <circle cx="1.5" cy="1.5" r="0.6" fill="#1E293B"/>
    </g>

    <!-- Ribbed Collar Left -->
    <path d="M 210,130 C 235,138 275,145 285,150 L 265,225 C 245,190 220,165 210,130 Z" 
          fill="url(#polo_burgundy_collar)" stroke="#3B1015" stroke-width="2"/>
    <path d="M 212,133 C 235,141 273,148 283,153 L 265,221" stroke="#E5B887" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Ribbed Collar Right -->
    <path d="M 390,130 C 365,138 325,145 315,150 L 335,225 C 355,190 380,165 390,130 Z" 
          fill="url(#polo_burgundy_collar)" stroke="#3B1015" stroke-width="2"/>
    <path d="M 388,133 C 365,141 327,148 317,153 L 335,221" stroke="#E5B887" stroke-width="1.5" fill="none" opacity="0.6"/>

    <!-- Chest JACARIO Emblem -->
    <g transform="translate(365, 255)">
      <!-- Minimalist Luxury Monogram Emblem -->
      <circle cx="0" cy="0" r="11" fill="none" stroke="#E5B887" stroke-width="1.2" opacity="0.85"/>
      <path d="M -4,-5 L 2,-5 C 5,-5 5,-1 2,-1 L -4,-1 M -1,-1 L -1,5 C -1,7 -4,7 -4,5" 
            fill="none" stroke="#E5B887" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- Subtle Folds & Muscle Contours -->
    <path d="M 185,270 C 210,300 220,380 215,480" stroke="#3B1015" stroke-width="3" fill="none" opacity="0.12"/>
    <path d="M 415,270 C 390,300 380,380 385,480" stroke="#3B1015" stroke-width="3" fill="none" opacity="0.12"/>
  </g>
</svg>