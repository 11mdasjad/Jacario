<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" class="w-full h-full object-contain">
  <defs>
    <linearGradient id="polo_det_forest_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D6A4F" />
      <stop offset="60%" stop-color="#1B4332" />
      <stop offset="100%" stop-color="#081C15" />
    </linearGradient>
    <pattern id="polo_det_forest_pique" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#ffffff" fill-opacity="0.06" />
      <circle cx="4" cy="4" r="0.9" fill="#000000" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="600" height="700" fill="#f8f9fa" opacity="0.4" rx="20"/>

  <!-- Zoomed Close-up Placket & Collar & Luxury Fabric View -->
  <g transform="translate(0, 0)">
    <!-- Fabric Background -->
    <rect x="50" y="50" width="500" height="600" rx="16" fill="url(#polo_det_forest_bg)"/>
    <rect x="50" y="50" width="500" height="600" rx="16" fill="url(#polo_det_forest_pique)"/>

    <!-- Close-up Placket Section -->
    <rect x="220" y="80" width="160" height="500" fill="#1B4332" stroke="#081C15" stroke-width="3"/>
    <rect x="220" y="80" width="160" height="500" fill="url(#polo_det_forest_pique)"/>
    
    <!-- Fine Stitching -->
    <line x1="235" y1="80" x2="235" y2="580" stroke="#081C15" stroke-width="2" stroke-dasharray="6,6"/>
    <line x1="365" y1="80" x2="365" y2="580" stroke="#081C15" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Top Button -->
    <g transform="translate(300, 180) scale(1.8)">
      <circle cx="0" cy="0" r="10" fill="#E5E7EB" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#475569" stroke-width="0.8"/>
      <circle cx="-3" cy="-3" r="1" fill="#1E293B"/>
      <circle cx="3" cy="-3" r="1" fill="#1E293B"/>
      <circle cx="-3" cy="3" r="1" fill="#1E293B"/>
      <circle cx="3" cy="3" r="1" fill="#1E293B"/>
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#D4AF37" stroke-width="0.8"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#D4AF37" stroke-width="0.8"/>
    </g>

    <!-- Bottom Button -->
    <g transform="translate(300, 360) scale(1.8)">
      <circle cx="0" cy="0" r="10" fill="#E5E7EB" stroke="#64748B" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#475569" stroke-width="0.8"/>
      <circle cx="-3" cy="-3" r="1" fill="#1E293B"/>
      <circle cx="3" cy="-3" r="1" fill="#1E293B"/>
      <circle cx="-3" cy="3" r="1" fill="#1E293B"/>
      <circle cx="3" cy="3" r="1" fill="#1E293B"/>
      <line x1="-3" y1="-3" x2="3" y2="3" stroke="#D4AF37" stroke-width="0.8"/>
      <line x1="3" y1="-3" x2="-3" y2="3" stroke="#D4AF37" stroke-width="0.8"/>
    </g>

    <!-- Luxury Seal Label Badge -->
    <g transform="translate(300, 520)">
      <rect x="-120" y="-30" width="240" height="60" rx="8" fill="#0B0D10" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="0" y="-5" fill="#D4AF37" font-family="'Cinzel', serif" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle">JACARIO</text>
      <text x="0" y="16" fill="#A1A1AA" font-family="sans-serif" font-size="9" letter-spacing="2" text-anchor="middle">CRAFTED ELEGANCE</text>
    </g>
  </g>
</svg>